---
# The example schema linkml-sidecar lays down, so that `just lint`,
# `just gen-project` and `just test` have something to run on from the first
# minute. Replace it with <PROJ_NAME>'s own model (the linkml-author skill
# does that), keeping the header, and replace the data under tests/data/ with
# it. The example is the linkml-project-copier Person model with every element
# described and snake_case values, so it passes linkml-lint's recommended rules.
id: <SCHEMA_ID>
name: <PROJ_SLUG>
title: <PROJ_NAME>
description: >-
  <PROJ_DESC>
license: <LICENSE_ID>
see_also:
  - <DOCS_URL>

prefixes:
  <PROJ_SLUG>: <SCHEMA_ID>/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
default_prefix: <PROJ_SLUG>
default_range: string

imports:
  - linkml:types

classes:

  NamedThing:
    description: >-
      A generic grouping for any identifiable entity
    slots:
      - id
      - name
      - description
    class_uri: schema:Thing

  Person:
    is_a: NamedThing
    description: >-
      Represents a Person
    slots:
      - primary_email
      - birth_date
      - age_in_years
      - vital_status
    slot_usage:
      primary_email:
        pattern: "^\\S+@[\\S+\\.]+\\S+"

  PersonCollection:
    tree_root: true
    description: >-
      A holder for Person objects
    attributes:
      people:
        description: The people in this collection
        range: Person
        multivalued: true
        inlined_as_list: true

slots:

  id:
    identifier: true
    slot_uri: schema:identifier
    range: uriorcurie
    description: A unique identifier for a thing

  name:
    slot_uri: schema:name
    description: A human-readable name for a thing

  description:
    slot_uri: schema:description
    description: A human-readable description for a thing

  primary_email:
    slot_uri: schema:email
    description: The main email address of a person

  birth_date:
    slot_uri: schema:birthDate
    range: date
    description: Date on which a person is born

  age_in_years:
    range: integer
    description: Number of years since birth

  vital_status:
    range: PersonStatus
    description: living or dead status

enums:

  PersonStatus:
    description: The vital status of a person
    permissible_values:
      alive:
        description: the person is living
        meaning: PATO:0001421
      dead:
        description: the person is deceased
        meaning: PATO:0001422
      unknown:
        description: the vital status is not known
