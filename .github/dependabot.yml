version: 2
updates:
  # Keeps this repository's OWN workflows (.github/workflows/*.yml) current.
  # It understands the `@<sha> # v1.2.3` pin convention used throughout, and
  # opens a pull request bumping both when a pinned action releases.
  #
  # This does NOT reach the workflow template under
  # skills/linkml-sidecar/templates/github/. Dependabot's github-actions
  # ecosystem only scans .github/workflows/ (or a root action.yml), a known
  # limitation (dependabot/dependabot-core#5970). That pin still needs a
  # manual bump; the lint-workflows job's actionlint step catches syntax
  # drift, not staleness.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
