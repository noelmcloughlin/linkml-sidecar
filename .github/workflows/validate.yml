name: Validate

# Validate every pull request and every push to main: the repository contract,
# the behavioural tests (fast ones offline, slow ones against the pinned
# template with the network), script and workflow linting, the install path,
# and Markdown and link checks, each as its own job so failures are easy to
# read. Also weekly and on demand, so link rot, an upstream `gh skill` change
# or a template that no longer renders is caught between pull requests.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    name: Validate repository contract & Agent Skills spec
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate repository contract
        run: bash scripts/validate-repository.sh

      - name: Verify gh skill support
        run: gh skill --help

      - name: Validate Agent Skills spec (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

  test-scripts:
    name: Test the scaffold, the preflight and the workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install just
        run: |
          uv tool install rust-just==1.47.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The slow tests run the real copier against the pinned tag of the
      # template, cloned once here, then `just install`, `lint`, `test` and
      # `site` on a plain host and a KTL host.
      # The tests skip the scaffold's own pin check (they run it offline too),
      # so the clone is checked here: the tag must still name the pinned
      # commit, or the slow tests would test whatever the tag points at now.
      - name: Clone the pinned template
        run: |
          pin="$(grep -oE 'LINKML_TEMPLATE_REF:=v[0-9.]+' skills/linkml-sidecar/scripts/linkml-scaffold.sh | sed 's/.*:=//')"
          sha="$(grep -oE 'LINKML_TEMPLATE_SHA:=[0-9a-f]{40}' skills/linkml-sidecar/scripts/linkml-scaffold.sh | sed 's/.*:=//')"
          git clone --branch "$pin" https://github.com/linkml/linkml-project-copier .template-cache/linkml-project-copier
          head="$(git -C .template-cache/linkml-project-copier rev-parse HEAD)"
          if [ "$head" != "$sha" ]; then
            echo "::error::the template's tag $pin is $head, not the pinned $sha; read the template before moving the pin" >&2
            exit 1
          fi

      - name: Run the tests
        env:
          LINKML_SIDECAR_SLOW: "1"
        run: uv run --no-project --with-requirements tests/requirements.txt pytest

  lint-scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # With no paths given actionlint looks only under .github/workflows/,
      # so the workflow template hosts copy is named explicitly.
      # The action pins themselves are check 9 of scripts/validate-repository.sh.
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color .github/workflows/validate.yml .github/workflows/semantic-release.yml .github/workflows/publish.yml skills/linkml-sidecar/templates/github/linkml-sidecar.yaml

  smoke-test:
    name: Smoke-test the install path
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run the install smoke test
        run: bash scripts/smoke-test-install.sh "$GITHUB_WORKSPACE"

  validate-markdown:
    name: Lint Markdown & check links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress "**/*.md"
          fail: true

      # lychee skips GitHub's issue and pull request pages, which can answer a
      # runner with 500 while the issue is open (lychee.toml). Each one is
      # checked here through the API with the job's own token: a deleted or
      # moved issue still fails, and a page GitHub fails to render does not.
      - name: Check GitHub issue and pull request links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          for link in $(git ls-files '*.md' | xargs grep -ohE 'https://github\.com/[^/ )>]+/[^/ )>]+/(issues|pull)/[0-9]+' | sort -u); do
            path="${link#https://github.com/}"
            repo="${path%/*/*}"
            number="${path##*/}"
            if gh api "repos/$repo/issues/$number" --silent; then echo "OK   $link"; else echo "FAIL $link"; status=1; fi
          done
          exit "$status"

      # Not codespell-project/actions-codespell: it hands its path to codespell
      # unquoted under /bin/sh, where `**/*.md` means `*/*.md` and matches no
      # file here, so it checked nothing. git ls-files lists the tracked
      # Markdown, the fixtures and templates included.
      - name: codespell
        run: git ls-files -z '*.md' | xargs -0 pipx run --spec codespell==2.4.2 codespell
