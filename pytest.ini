[pytest]
testpaths = tests
addopts = -ra -p no:cacheprovider --strict-markers
# The slow tests build two virtual environments under the base temp; keep only a failed run's.
tmp_path_retention_policy = failed
markers =
    slow: runs copier, uv and just on a throwaway host; needs LINKML_SIDECAR_SLOW=1 and the network
