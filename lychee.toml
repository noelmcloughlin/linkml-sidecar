# lychee link-checker config (validate.yml's "Check links" step, and local runs).
exclude = [
  # This repository's own GitHub URL, until it is published; drop after.
  '^https://github\.com/noelmcloughlin/linkml-sidecar',
  # Example hosts the templates and tests use.
  '^https://acme\.',
  '^https://fixture\.',
  '\.example/',
  # The docs site URL is a placeholder until a host renders it.
  '^https://w3id\.org/lokf/context\.jsonld$',
]
exclude_path = [
  "(^|/)\\.template-cache/",
  "(^|/)\\.venv/",
]
