# lychee link-checker config (validate.yml's "Check links" step, and local
# runs). The github.com handling below follows knowledge-trust-ladder's
# lychee.toml, which met the same 503s first.

# A failed request is retried with a wait that grows each time, so a host
# that answers a burst with 503 has time to recover before the link is
# declared dead.
max_retries = 3
retry_wait_time = 5

exclude = [
  # Example hosts the templates and tests use.
  '^https://acme\.',
  '^https://fixture\.',
  '\.example/',
  # The fixture bundle's context IRI; the real one is served by w3id once LOKF publishes it.
  '^https://w3id\.org/lokf/context\.jsonld$',
  # A GitHub issue or pull request page can answer a CI runner with 500 while
  # the issue is open and the page serves 200 elsewhere. validate.yml's next
  # step checks each such link through GitHub's API instead, so a deleted or
  # moved issue still fails.
  '^https://github\.com/[^/]+/[^/]+/(issues|pull)/[0-9]+',
]

# Regular expressions over the file path. The fixtures and the pages rendered
# into a host hold links that resolve only there (docs/index.md links the
# elements gen-doc writes). Hidden folders are skipped by lychee itself.
exclude_path = [
  "(^|/)tests/fixtures/",
  "/templates/linkml/docs/",
  # knowledge_bundle is a link to .lokf/knowledge, so the same files would be
  # checked twice.
  "(^|/)knowledge_bundle/",
  # What the website's build writes, with links that resolve only once the
  # site is served; website/'s own link check covers them (ktl-website Step 2).
  "(^|/)website/(dist|public|src/content|src/generated|node_modules)/",
]

# github.com answers automated clients with 503 or 429 on a file page
# (/blob/) while it serves the repository pages. raw.githubusercontent.com
# serves the same file at the same commit, tag or branch, and answers 404
# once the file is gone, so lychee checks each file link there instead.
# lychee remaps a link before it applies `exclude`, so an exclusion for a
# file link must name its raw address.
remap = [
  '^https://github\.com/([^/]+/[^/]+)/blob/([^?#]+)([?#].*)?$ https://raw.githubusercontent.com/$1/$2',
]

# The rest of github.com also answers a burst of requests from one runner
# with 503. Pace the requests to it rather than exclude it, so a moved or
# deleted page still fails.
[hosts."github.com"]
concurrency = 2
request_interval = "250ms"
